# Giới hạn ai trong cụm gọi tới được Cube — và một giới hạn của chính cách này.
#
# ĐÃ THỬ VÀ KHÔNG DÙNG ĐƯỢC cho cổng 4000 (REST API).
#
# ingress-nginx chạy hostNetwork, và NetworkPolicy không chọn được lưu lượng đó:
# namespaceSelector không khớp (hostNetwork nằm ngoài mô hình pod), ipBlock theo
# dải node 10.123.123.0/24 không khớp, ipBlock theo địa chỉ SNAT 10.42.0.0/32
# cũng không khớp. Áp chính sách vào là người dùng đăng nhập SSO thành công rồi
# gặp 502 ngay sau đó — nginx bị chặn khi chuyển tiếp.
#
# Nới cho cả dải pod 10.42.0.0/16 thì vô nghĩa: mọi pod đều nằm trong dải đó.
#
# Hệ quả phải nói thẳng: bật Playground (cần dev mode) đồng nghĩa REST API cổng
# 4000 KHÔNG cưỡng chế JWT và mọi pod trong cụm gọi được. Chấp nhận được ở môi
# trường kiểm chứng một chủ, nhưng phải TẮT dev mode trước khi ra thật — xem
# docs/roadmap.md.
#
# Phần còn giữ được: cổng 15432 (SQL API) và Cube Store, vì cả hai chỉ nhận lưu
# lượng pod-đến-pod, thứ NetworkPolicy chọn được chính xác.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cube-sql-chi-cho-bi
  namespace: stc-hy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cube
  policyTypes: [Ingress]
  ingress:
    # Cổng 4000 mở cho mọi nguồn — không phải vì muốn, mà vì không chặn được
    # ingress-nginx mà không chặn luôn người dùng. Lớp bảo vệ thật của cổng này
    # là ingress đứng sau SSO.
    - ports:
        - { protocol: TCP, port: 4000 }
    # Cổng SQL thì chặn được: chỉ Superset và Airflow là pod thường.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: stc-hy-bi
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: stc-hy-airflow
      ports:
        - { protocol: TCP, port: 15432 }
---
# Cube Store chỉ phục vụ Cube, không ai khác cần chạm tới.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cubestore-chi-cho-cube
  namespace: stc-hy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cubestore
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cube
      ports:
        - { protocol: TCP, port: 3030 }
