---
apiVersion: v1
kind: Service
metadata:
  name: mock-qlgia
  namespace: stc-hy
  labels: {app: mock-qlgia, vai-tro: nguon-gia-lap}
spec:
  selector: {app: mock-qlgia}
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-qlgia
  namespace: stc-hy
  labels: {app: mock-qlgia, vai-tro: nguon-gia-lap}
spec:
  replicas: 1
  selector:
    matchLabels: {app: mock-qlgia}
  template:
    metadata:
      labels: {app: mock-qlgia, vai-tro: nguon-gia-lap}
      annotations:
        # đổi khi sửa mã nguồn -> ép pod nạp lại ConfigMap
        checksum/src: "v1"
    spec:
      containers:
        - name: app
          image: python:3.12-slim
          command: ["python", "-u", "/app/mock_qlgia.py"]
          env:
            - name: PORT
              value: "8080"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - {name: http, containerPort: 8080}
          volumeMounts:
            - {name: src, mountPath: /app, readOnly: true}
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 300m, memory: 256Mi}
      volumes:
        - name: src
          configMap: {name: mock-qlgia-src}
