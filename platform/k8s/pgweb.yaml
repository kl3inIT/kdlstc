# Lightweight, PostgreSQL-only database inspector.
#
# The UI is deliberately read-only. Approved connections are pgweb bookmark
# files mounted from the pgweb-bookmarks Secret; credentials are never stored
# in this manifest. Users authenticate through the existing Keycloak-backed
# oauth2-proxy and choose one of those saved connections.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgweb
  namespace: stc-hy
  labels:
    app.kubernetes.io/name: pgweb
    app.kubernetes.io/part-of: stc-warehouse
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pgweb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pgweb
        app.kubernetes.io/part-of: stc-warehouse
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pgweb
          image: docker.io/sosedoff/pgweb:0.17.0
          imagePullPolicy: IfNotPresent
          args:
            - --sessions
            - --bookmarks-only
            - --bookmarks-dir=/home/pgweb/.pgweb/bookmarks
            - --prefix=db
            - --readonly
            - --log-forwarded-user
            - --no-ssh
            - --skip-open
            - --open-timeout=10
            - --query-timeout=60
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: bookmarks
              mountPath: /home/pgweb/.pgweb/bookmarks
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: bookmarks
          secret:
            secretName: pgweb-bookmarks
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pgweb
  namespace: stc-hy
  labels:
    app.kubernetes.io/name: pgweb
    app.kubernetes.io/part-of: stc-warehouse
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pgweb
  ports:
    - name: http
      port: 8081
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pgweb
  namespace: stc-hy
  annotations:
    nginx.ingress.kubernetes.io/auth-url: "http://oauth2-proxy/oauth2/auth"
    nginx.ingress.kubernetes.io/auth-signin: "https://storage.example.com/oauth2/start?rd=$escaped_request_uri"
    nginx.ingress.kubernetes.io/auth-response-headers: "X-Auth-Request-User,X-Auth-Request-Email,X-Auth-Request-Preferred-Username"
spec:
  ingressClassName: nginx
  rules:
    - host: storage.example.com
      http:
        paths:
          - path: /db
            pathType: Prefix
            backend:
              service:
                name: pgweb
                port:
                  name: http
