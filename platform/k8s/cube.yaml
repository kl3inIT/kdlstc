# Cube — lớp ngữ nghĩa của lớp 4 trong kiến trúc.
#
# Kết nối bằng vai trò CHỈ ĐỌC imate_reader, cùng danh tính mà Superset dùng.
# Không dùng vai trò ghi: lớp phục vụ không có lý do gì để sửa được kho, và bước
# 6 mỗi lượt đều thử ghi để bắt buộc bị từ chối.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cube
  namespace: stc-hy
  labels:
    app.kubernetes.io/name: cube
    app.kubernetes.io/part-of: kho-du-lieu-stc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cube
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cube
      annotations:
        # Đổi model thì phải cuộn lại pod; annotation này để lệnh apply nhận ra.
        stc/model-configmap: cube-model
    spec:
      # Tắt biến môi trường tự sinh từ Service.
      #
      # Kubernetes tiêm CUBESTORE_PORT=tcp://10.43.x.x:3030 cho mọi pod cùng
      # namespace với Service tên cubestore — mà chính Cube Store đọc biến tên đó
      # làm cổng của nó, rồi chết vì "invalid digit found in string". Địa chỉ đã
      # truyền tường minh qua CUBEJS_CUBESTORE_HOST/PORT, nên không cần biến tự
      # sinh nào cả.
      enableServiceLinks: false
      containers:
        - name: cube
          image: cubejs/cube:v1.7.24
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
            - name: sql
              containerPort: 15432
          env:
            # Playground BẬT, nhưng chỉ vì có hai lớp bù bên dưới.
            #
            # Đánh đổi phải nói rõ: dev mode làm Cube NGỪNG cưỡng chế JWT trên
            # REST API. Trước đây tắt nó chính vì lý do ấy. Bật lại để có giao
            # diện thì phải trả bằng hai thứ khác, nếu không là quay về đúng lỗ
            # hổng cũ với một cái tên khác:
            #
            #   1. Ingress đi qua oauth2-proxy — không ai từ ngoài vào được nếu
            #      chưa đăng nhập Keycloak.
            #   2. NetworkPolicy trong cube-networkpolicy.yaml — trong cụm chỉ
            #      Airflow, Superset và ingress-nginx gọi tới được. Thiếu lớp này
            #      thì mọi pod trong cụm đọc được kho tài chính không cần khoá.
            #
            # SQL API mà Superset dùng KHÔNG bị ảnh hưởng: nó có user/mật khẩu
            # riêng, không dùng JWT.
            - name: CUBEJS_DEV_MODE
              value: "true"
            - name: CUBEJS_CUBESTORE_HOST
              value: cubestore.stc-hy.svc.cluster.local
            - name: CUBEJS_CUBESTORE_PORT
              value: "3030"
            - name: CUBEJS_DB_TYPE
              value: postgres
            - name: CUBEJS_DB_HOST
              valueFrom: { secretKeyRef: { name: cube-db, key: host } }
            - name: CUBEJS_DB_NAME
              valueFrom: { secretKeyRef: { name: cube-db, key: dbname } }
            - name: CUBEJS_DB_USER
              valueFrom: { secretKeyRef: { name: cube-db, key: user } }
            - name: CUBEJS_DB_PASS
              valueFrom: { secretKeyRef: { name: cube-db, key: password } }
            - name: CUBEJS_API_SECRET
              valueFrom: { secretKeyRef: { name: cube-db, key: api-secret } }
            # SQL API để Superset nối thẳng bằng giao thức PostgreSQL.
            - name: CUBEJS_PG_SQL_PORT
              value: "15432"
            - name: CUBEJS_SQL_USER
              valueFrom: { secretKeyRef: { name: cube-db, key: sql-user } }
            - name: CUBEJS_SQL_PASSWORD
              valueFrom: { secretKeyRef: { name: cube-db, key: sql-password } }
            # KHÔNG đặt CUBEJS_SCHEMA_PATH: Cube v1 đã mặc định quét thư mục
            # model/, đặt thêm biến này khiến nó quét cùng một cây hai lần và
            # dừng với "Found duplicate cube name".
          volumeMounts:
            # Gắn theo subPath, không gắn cả thư mục.
            #
            # ConfigMap gắn dạng thư mục luôn kèm một thư mục ẩn ..data trỏ tới
            # chính các tệp đó; Cube quét đệ quy nên nạp mỗi model HAI lần và
            # dừng với "Found duplicate cube name". subPath gắn thẳng một tệp,
            # không sinh liên kết ẩn.
            #
            # Đánh đổi: tệp gắn theo subPath không tự cập nhật khi ConfigMap đổi.
            # Không sao — script triển khai vẫn cuộn lại pod sau mỗi lần đổi model.
            - name: model
              mountPath: /cube/conf/model/cubes/van_ban.yml
              subPath: van_ban.yml
              readOnly: true
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits:   { cpu: 500m, memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: model
          configMap: { name: cube-model }
---
apiVersion: v1
kind: Service
metadata:
  name: cube
  namespace: stc-hy
  labels:
    app.kubernetes.io/name: cube
spec:
  selector:
    app.kubernetes.io/name: cube
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: sql
      port: 15432
      targetPort: sql
---
# Cube Store — hàng đợi và bộ nhớ đệm của Cube.
#
# Bắt buộc khi CUBEJS_DEV_MODE tắt: ở chế độ thật Cube không chấp nhận hàng đợi
# trong bộ nhớ tiến trình, vì một pod khởi động lại sẽ mất hết truy vấn đang
# chạy và hai bản sao sẽ không thấy việc của nhau.
#
# Dùng emptyDir chứ không phải PVC: đây thuần tuý là bộ nhớ đệm — mất thì Cube
# tính lại từ kho, không mất dữ liệu nào. Đổi lại tiết kiệm một PVC trong hạn
# mức namespace, và tránh một ổ đĩa phải sao lưu mà không chứa gì đáng sao lưu.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cubestore
  namespace: stc-hy
  labels:
    app.kubernetes.io/name: cubestore
    app.kubernetes.io/part-of: kho-du-lieu-stc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cubestore
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cubestore
    spec:
      # Tắt biến môi trường tự sinh từ Service.
      #
      # Kubernetes tiêm CUBESTORE_PORT=tcp://10.43.x.x:3030 cho mọi pod cùng
      # namespace với Service tên cubestore — mà chính Cube Store đọc biến tên đó
      # làm cổng của nó, rồi chết vì "invalid digit found in string". Địa chỉ đã
      # truyền tường minh qua CUBEJS_CUBESTORE_HOST/PORT, nên không cần biến tự
      # sinh nào cả.
      enableServiceLinks: false
      containers:
        - name: cubestore
          image: cubejs/cubestore:v1.7.24
          imagePullPolicy: IfNotPresent
          ports:
            - name: cubestore
              containerPort: 3030
          env:
            - name: CUBESTORE_DATA_DIR
              value: /cube/data
          volumeMounts:
            - name: data
              mountPath: /cube/data
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: cubestore
  namespace: stc-hy
  labels:
    app.kubernetes.io/name: cubestore
spec:
  selector:
    app.kubernetes.io/name: cubestore
  ports:
    - name: cubestore
      port: 3030
      targetPort: cubestore
