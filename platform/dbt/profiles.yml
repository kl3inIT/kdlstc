stc_warehouse:
  target: prod
  outputs:
    prod:
      type: postgres
      host: "{{ env_var('DWH_HOST') }}"
      port: 5432
      user: "{{ env_var('DWH_USER') }}"
      password: "{{ env_var('DWH_PASSWORD') }}"
      dbname: "{{ env_var('DWH_DBNAME') }}"
      schema: staging
      threads: 4
      connect_timeout: 10
      sslmode: require
