stc_imate:
  target: prod
  outputs:
    prod:
      type: postgres
      host: "{{ env_var('IMATE_DWH_HOST') }}"
      port: 5432
      user: "{{ env_var('IMATE_DWH_USER') }}"
      password: "{{ env_var('IMATE_DWH_PASSWORD') }}"
      dbname: "{{ env_var('IMATE_DWH_DBNAME') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'curated') }}"
      threads: 4
      connect_timeout: 10
