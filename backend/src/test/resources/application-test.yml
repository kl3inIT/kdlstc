spring:
  datasource:
    url: jdbc:h2:mem:dwh_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: test-client
            client-secret: test-secret
            provider: keycloak
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile
        provider:
          keycloak:
            authorization-uri: http://localhost/oauth2/auth
            token-uri: http://localhost/oauth2/token
            user-info-uri: http://localhost/oauth2/userinfo
            jwk-set-uri: http://localhost/oauth2/jwks
            user-name-attribute: preferred_username

app:
  integration:
    airflow:
      mode: fixture
      base-url: http://localhost
      username: fixture
      password: fixture
      root-dag-id: imate_01_discover
      connect-timeout: 1s
      read-timeout: 1s
      token-ttl: 1m
      reconcile-delay: 30s
