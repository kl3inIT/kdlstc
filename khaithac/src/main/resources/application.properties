server.port=8090

spring.security.oauth2.client.registration.keycloak.client-id=khaithac-web
spring.security.oauth2.client.registration.keycloak.client-secret=${KC_CLIENT_SECRET:}
spring.security.oauth2.client.registration.keycloak.scope=openid,profile
spring.security.oauth2.client.provider.keycloak.issuer-uri=${KC_ISSUER_URI:https://auth.x2h.com.vn/realms/stc-mock}
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KC_ISSUER_URI:https://auth.x2h.com.vn/realms/stc-mock}

khaithac.nguon.thu=${NGUON_THU_BASE:http://localhost:8081}
khaithac.nguon.chi=${NGUON_CHI_BASE:http://localhost:8082}

# AI (phase 2): OpenAI-compatible — key qua env, KHONG bao gio hardcode.
# Doi provider (9Router on-prem...) chi can doi base-url + key + model.
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=${AI_MODEL:gpt-5.4-mini}

logging.level.org.springframework.security=info
