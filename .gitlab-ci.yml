stages:
  - build

variables:
  STORAGE_DRIVER: vfs
  BUILDAH_FORMAT: docker
  KDLSTC_IMAGE_TAG: "0.1.0-20260822.1"

.kdlstc-image:
  stage: build
  image: quay.io/buildah/stable:v1.43.2
  before_script:
    - mkdir -p "/etc/containers/certs.d/$CI_REGISTRY"
    - cp "$CI_SERVER_TLS_CA_FILE" "/etc/containers/certs.d/$CI_REGISTRY/ca.crt"
    - echo "$CI_REGISTRY_PASSWORD" | buildah login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin

build:kdlstc-backend:
  extends: .kdlstc-image
  script:
    - export IMAGE="$CI_REGISTRY_IMAGE/kdlstc-operations-backend:$KDLSTC_IMAGE_TAG"
    - buildah build --pull --platform linux/amd64 --file backend/Dockerfile --tag "$IMAGE" backend
    - buildah push "$IMAGE"

build:kdlstc-frontend:
  extends: .kdlstc-image
  script:
    - export IMAGE="$CI_REGISTRY_IMAGE/kdlstc-operations-frontend:$KDLSTC_IMAGE_TAG"
    - buildah build --pull --platform linux/amd64 --file frontend/Dockerfile --tag "$IMAGE" frontend
    - buildah push "$IMAGE"
