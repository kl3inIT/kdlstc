server.port=8082

# Keycloak dev (auth.x2h.com.vn - can VPN). Override bang env KC_ISSUER_URI khi
# chay local voi Keycloak docker (vd http://localhost:8180/realms/stc-mock).
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KC_ISSUER_URI:https://auth.x2h.com.vn/realms/stc-mock}

# App headless (OAuth2 resource server, khong co UI): vaadin-spring chi vao
# classpath qua jmix-oidc-starter -> security-flowui; khong exclude thi dev-mode
# listener doi 'vaadin-dev-server' va fail khi start.
spring.autoconfigure.exclude=com.vaadin.flow.spring.SpringBootAutoConfiguration,com.vaadin.flow.spring.SpringSecurityAutoConfiguration

# Moi request /rest/** deu phai mang JWT hop le — fail closed, khong anonymous.
jmix.resource-server.authenticated-url-patterns=/rest/**

main.datasource.url=jdbc:hsqldb:file:.jmix/hsqldb/mockchi
main.datasource.username=sa
main.datasource.password=

main.liquibase.change-log=vn/dth/mockchi/liquibase/changelog.xml

jmix.core.available-locales=en

logging.level.eclipselink.logging.sql=info
logging.level.io.jmix.core.datastore=info
logging.level.io.jmix.core.AccessLogger=debug
logging.level.io.jmix=info
logging.level.org.springframework.security=info
